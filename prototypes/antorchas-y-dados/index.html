<html lang="es">
<head>

<body>

<script>
'use strict';
// Antorchas y Dados: a co-op tactics board for 1-4 heroes on one screen (hot seat).
// Kept from the one-shot starter: the fixed step, the clock hook, window.game, and the
// play and figures scenes the checks read.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size
const PIXEL = false;
const FONT = 'Georgia, "Palatino Linotype", "Book Antiqua", serif';
const TITLE = 'Antorchas y Dados';
const CONTROLS = [
  'Clic en una casilla azul: mover (1 PA)',
  'Clic en un enemigo: atacar (1 PA) · en una puerta o cofre al lado: abrir (1 PA)',
  'Clic en una carta o teclas 1 / 2: usarla · clic derecho o Esc: cancelar',
  'Espacio: fin de turno · Z: deshacer movimiento · T: tónico',
  'Flechas / WASD o arrastrar con clic derecho: cámara · rueda: zoom · C: centrar · minimapa: ir a una sala',
  'M: silencio',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let baseTransform;
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
  baseTransform = ctx.getTransform();
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', bold = false) {
  ctx.fillStyle = c; ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function textO(s, x, y, size, c, align = 'center', bold = true) { // outlined text over the board
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = 'rgba(8,6,12,0.95)';
  ctx.strokeText(s, x, y); ctx.fillStyle = c; ctx.fillText(s, x, y);
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow') || e.code === 'Tab') e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());

// Pointer: clicks are queued and handled on the step; the camera drag is view only.
const mouse = { x: -1, y: -1 };
const clicks = [];
let drag = null, wheel = 0;
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
canvas.addEventListener('pointerdown', e => {
  startAudio();
  const p = toLogical(e); mouse.x = p.x; mouse.y = p.y;
  if (e.button === 1 || e.button === 2) drag = { x: p.x, y: p.y, moved: 0, button: e.button };
  else clicks.push({ x: p.x, y: p.y, button: 0 });
});
addEventListener('pointermove', e => {
  const p = toLogical(e);
  if (drag) {
    const dx = p.x - mouse.x, dy = p.y - mouse.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    cam.x -= dx / cam.zoom; cam.y -= dy / cam.zoom; cam.follow = false;
  }
  mouse.x = p.x; mouse.y = p.y;
});
addEventListener('pointerup', () => {
  if (drag && drag.moved < 6 && drag.button === 2) clicks.push({ x: drag.x, y: drag.y, button: 2 });
  drag = null;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); wheel += Math.sign(e.deltaY); }, { passive: false });

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0, slideTo = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
function sfx(name) {
  switch (name) {
    case 'step': tone(180, 0.06, 'triangle', 0.12); break;
    case 'door': tone(110, 0.4, 'sawtooth', 0.12, 0, 60); tone(70, 0.3, 'square', 0.08, 0.1); break;
    case 'chest': tone(520, 0.1, 'triangle', 0.18); tone(780, 0.18, 'triangle', 0.16, 0.08); break;
    case 'dice': for (let i = 0; i < 4; i++) tone(700 + i * 90, 0.03, 'square', 0.06, i * 0.06); break;
    case 'hit': tone(150, 0.14, 'square', 0.22, 0.25, 70); break;
    case 'crit': tone(150, 0.2, 'sawtooth', 0.25, 0.25, 50); tone(900, 0.15, 'triangle', 0.15, 0.25); break;
    case 'miss': tone(520, 0.1, 'sine', 0.14, 0.25, 300); break;
    case 'heal': tone(660, 0.2, 'sine', 0.16); tone(880, 0.25, 'sine', 0.14, 0.1); break;
    case 'fire': tone(90, 0.45, 'sawtooth', 0.22, 0, 40); break;
    case 'slam': tone(55, 0.6, 'sawtooth', 0.3, 0, 30); break;
    case 'alert': tone(440, 0.08, 'square', 0.12); tone(330, 0.1, 'square', 0.12, 0.08); break;
    case 'down': tone(330, 0.25, 'triangle', 0.2); tone(220, 0.35, 'triangle', 0.2, 0.2); break;
    case 'card': tone(400, 0.08, 'triangle', 0.14); tone(600, 0.1, 'triangle', 0.12, 0.06); break;
    case 'win': [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'triangle', 0.18, i * 0.14)); break;
    case 'lose': [330, 262, 196].forEach((f, i) => tone(f, 0.4, 'triangle', 0.18, i * 0.2)); break;
  }
}

// ---- The game: the dungeon ---------------------------------------------------------------
// 5x5 rooms of 12x12 cells, seen from above. rooms.js holds the room templates and art.js the
// painted images; the seed picks each room's template, which neighbours connect, and what is
// inside.
const ROOM = 12, RW = 5, N = ROOM * RW, TS = 64; // TS: world px per cell
const T_WALL = 0, T_FLOOR = 1, T_DOOR = 2, T_OPEN = 3;
const DIR4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const BOSS_ROOM = 12; // the centre room
// Players take the corner rooms in this order: opposite corners first, so two heroes converge.
const CORNER_ROOMS = [0, 24, 4, 20];
const DOORWAY = [5, 6]; // the cells of each side that open when two rooms connect
const TEMPLATES = window.ROOMS || {};
const ARTS = window.ART || {};
const TEMPLATE_IDS = Object.keys(TEMPLATES);
const tplOf = use => TEMPLATE_IDS.filter(k => TEMPLATES[k].use === use);
function checkTemplates() { // the rules rooms.js states; a broken template is named in the console
  for (const id of TEMPLATE_IDS) {
    const m = TEMPLATES[id].map, bad = [];
    if (!Array.isArray(m) || m.length !== ROOM || m.some(r => r.length !== ROOM)) bad.push('no es de 12x12');
    else {
      for (let i = 0; i < ROOM; i++) for (const [x, y] of [[i, 0], [i, ROOM - 1], [0, i], [ROOM - 1, i]]) if (!'#t'.includes(m[y][x])) bad.push(`anillo abierto en ${x},${y}`);
      for (const d of DOORWAY) for (const [x, y] of [[d, 1], [d, ROOM - 2], [1, d], [ROOM - 2, d]]) if (m[y][x] !== '.') bad.push(`entrada tapada en ${x},${y}`);
      const open = (x, y) => m[y] && (m[y][x] === '.');
      let floor = 0; for (const r of m) for (const ch of r) if (ch === '.') floor++;
      const seen = new Set([`${DOORWAY[0]},1`]), q = [[DOORWAY[0], 1]];
      while (q.length) {
        const [x, y] = q.pop();
        for (const [dx, dy] of DIR4) { const k = `${x + dx},${y + dy}`; if (!seen.has(k) && open(x + dx, y + dy)) { seen.add(k); q.push([x + dx, y + dy]); } }
      }
      if (seen.size < floor) bad.push(`${floor - seen.size} casillas de suelo sin camino`);
    }
    if (bad.length) console.warn(`rooms.js: ${id}: ${bad.slice(0, 3).join(', ')}`);
  }
}
checkTemplates();

const CLASSES = ['warrior', 'mage', 'healer', 'archer'];
const CLASS_INFO = {
  warrior: { name: 'Guerrero', cards: ['charge', 'shout'] },
  mage: { name: 'Mago', cards: ['fireball', 'blink'] },
  healer: { name: 'Curandero', cards: ['heal', 'ward'] },
  archer: { name: 'Arquero', cards: ['aimed', 'volley'] },
};
const ENEMY_NAMES = { skeleton: 'Esqueleto', goblin: 'Arquero goblin', rat: 'Rata de cripta', boss: 'El Carcelero' };
const PLAYER_COLORS = ['#e8573f', '#3f8fe8', '#e8c43f', '#4fc46a'];
const CARDS = {
  charge: { name: 'Embestida', target: 'enemyAdj', text: () => [`Empuja ${tune.charge_push} casillas a un`, `enemigo al lado: ${tune.charge_dmg} daño,`, `+${tune.charge_crash} si choca.`] },
  shout: { name: 'Grito de guardia', target: 'self', text: () => [`Enemigos a ${tune.shout_radius} o menos`, 'van a por ti este', `turno. Escudo ${tune.shout_shield}.`] },
  fireball: { name: 'Bola de fuego', target: 'area', range: 'fireball_range', text: () => ['Área 3x3 a la vista:', `${tune.fireball_dmg} daño a enemigos.`, 'Siempre acierta.'] },
  blink: { name: 'Parpadeo', target: 'tile', range: 'blink_range', text: () => ['Te teletransportas a', `una casilla libre a ${tune.blink_range}`, 'o menos.'] },
  heal: { name: 'Sanar', target: 'ally', range: 'heal_range', text: () => [`Cura ${tune.heal_amount} a un aliado`, `a ${tune.heal_range} casillas o menos`, '(o a ti).'] },
  ward: { name: 'Escudo de luz', target: 'ally', range: 'ward_range', text: () => [`Escudo ${tune.ward_shield} a un aliado`, `a ${tune.ward_range} o menos, hasta`, 'el fin del turno enemigo.'] },
  aimed: { name: 'Disparo certero', target: 'enemy', text: () => ['Ataque que ignora la', `cobertura, +${tune.aimed_bonus_hit}% y`, `+${tune.aimed_bonus_dmg} daño.`] },
  volley: { name: 'Lluvia de flechas', target: 'area', range: 'volley_range', text: () => ['Área 3x3 a la vista:', `${tune.volley_dmg} daño a enemigos.`, 'Siempre acierta.'] },
};

const idx = (x, y) => y * N + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const cheb = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
const manh = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function roomOf(x, y) { return inb(x, y) ? ((x / ROOM) | 0) + ((y / ROOM) | 0) * RW : -1; }
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function hstat(h, s) { return tune[`${h.cls}_${s}`]; }
function estat(e, s) { return tune[`${e.kind}_${s}`]; }

// ---- State ------------------------------------------------------------------------------
const setup = { count: 2, classes: ['warrior', 'mage', 'healer', 'archer'], row: 0 };
const cam = { x: 0, y: 0, zoom: 0.8, tx: 0, ty: 0, follow: true };
let scene, state, ui = [];

function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  const n = setup.count, players = CORNER_ROOMS.slice(0, n), rooms = RW * RW;
  state = {
    t: 0, score: 0, gained: '', round: 1, phase: 'hero', active: 0, mode: null,
    tiles: new Array(N * N).fill(T_WALL), objs: new Array(N * N).fill(null), doorAt: new Int16Array(N * N).fill(-1),
    rooms: [], doors: [], torches: [],
    revealed: new Array(rooms).fill(false), revealT: new Array(rooms).fill(-99), revealFrom: new Array(rooms).fill(null),
    heroes: [], enemies: [], log: [], pops: [], fx: [], dice: null, slam: [], taunt: null, undo: null,
    enemyQueue: [], enemyTimer: 0, autoEnd: 0, lock: 0, endTimer: 0, won: false, lost: false,
    banner: null, shake: 0, acting: null, players: n,
  };
  buildDungeon(players);
  for (let i = 0; i < n; i++) { // each hero in the outer corner of their room
    const r = CORNER_ROOMS[i], R = state.rooms[r], cls = setup.classes[i], hp = tune[cls + '_hp'];
    const x = R.rc * ROOM + (R.rc === 0 ? 2 : ROOM - 3), y = R.rr * ROOM + (R.rr === 0 ? 2 : ROOM - 3);
    state.heroes.push({ id: 'h' + i, hero: true, player: i, cls, kind: cls, x, y, hp, maxHp: hp,
      ap: 0, cds: [0, 0], shield: 0, downed: false, tonics: 0, miss: 0, flash: 0, anim: null, face: 1,
      stats: { dmg: 0, kills: 0, help: 0 } });
    state.revealed[r] = true;
  }
  populate(players);
  for (const e of state.enemies) if (state.revealed[e.room]) e.state = 'patrol';
  cam.zoom = tune.zoom_start;
  startHeroTurn(0, true);
  log('Objetivo: derrota a El Carcelero en la sala central.');
}
function buildDungeon(players) {
  const ordinary = tplOf('room'), start = tplOf('start')[0] || ordinary[0], bossT = tplOf('boss')[0] || ordinary[0];
  for (let r = 0; r < RW * RW; r++) {
    const tpl = r === BOSS_ROOM ? bossT : players.includes(r) ? start : ordinary[Math.floor(rng() * ordinary.length)];
    const R = { tpl, rc: r % RW, rr: (r / RW) | 0, variant: Math.floor(rng() * 997) };
    state.rooms.push(R);
    const m = TEMPLATES[tpl].map;
    for (let ly = 0; ly < ROOM; ly++) for (let lx = 0; lx < ROOM; lx++) {
      const x = R.rc * ROOM + lx, y = R.rr * ROOM + ly, ch = m[ly][lx], i = idx(x, y);
      state.tiles[i] = ch === '.' || ch === 'o' ? T_FLOOR : T_WALL;
      if (ch === 'o') state.objs[i] = 'pillar';
      if (ch === 't') { // its light comes from the side that faces the floor
        const [dx, dy] = torchFacing(m, lx, ly);
        state.torches.push({ x, y, room: r, dx, dy, lx: x + dx * 0.6, ly: y + dy * 0.6 });
      }
    }
  }
  // Which neighbours connect: a random maze that joins every room, then a few extra doors.
  const edges = [];
  for (let r = 0; r < RW * RW; r++) {
    if (r % RW < RW - 1) edges.push([r, r + 1]);
    if (((r / RW) | 0) < RW - 1) edges.push([r, r + RW]);
  }
  for (let i = edges.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [edges[i], edges[j]] = [edges[j], edges[i]]; }
  const parent = [...Array(RW * RW).keys()];
  const find = a => parent[a] === a ? a : (parent[a] = find(parent[a]));
  for (const [a, b] of edges) {
    const joins = find(a) !== find(b);
    if (joins) parent[find(a)] = find(b);
    if (joins || rng() * 100 < tune.extra_door_chance) addDoor(a, b);
  }
}
function torchFacing(m, lx, ly) {
  for (const [dx, dy] of DIR4) { const c = m[ly + dy] && m[ly + dy][lx + dx]; if (c === '.' || c === 'o') return [dx, dy]; }
  return [0, 0];
}
function addDoor(a, b) { // a 2x2 doorway across both rooms' walls, cells 5-6 of the shared side
  const A = state.rooms[a], side = b === a + 1;
  const d = { rooms: [a, b], open: false, orient: side ? 'v' : 'h', tiles: [],
    x0: side ? A.rc * ROOM + ROOM - 1 : A.rc * ROOM + DOORWAY[0],
    y0: side ? A.rr * ROOM + DOORWAY[0] : A.rr * ROOM + ROOM - 1 };
  for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
    const x = d.x0 + dx, y = d.y0 + dy, i = idx(x, y);
    d.tiles.push({ x, y }); state.tiles[i] = T_DOOR; state.doorAt[i] = state.doors.length;
  }
  state.doors.push(d);
}
function freeCell(r) { // a random empty floor cell of a room, off the cells inside its doorways
  const R = state.rooms[r], cells = [];
  for (let ly = 1; ly < ROOM - 1; ly++) for (let lx = 1; lx < ROOM - 1; lx++) {
    if ((DOORWAY.includes(lx) && (ly === 1 || ly === ROOM - 2)) || (DOORWAY.includes(ly) && (lx === 1 || lx === ROOM - 2))) continue;
    const x = R.rc * ROOM + lx, y = R.rr * ROOM + ly, i = idx(x, y);
    if (state.tiles[i] === T_FLOOR && !state.objs[i] && !unitAt(x, y)) cells.push([x, y]);
  }
  return cells.length ? cells[Math.floor(rng() * cells.length)] : null;
}
function pickKind() {
  const w = [['skeleton', tune.spawn_skeleton], ['goblin', tune.spawn_goblin], ['rat', tune.spawn_rat]];
  let k = rng() * w.reduce((s, [, v]) => s + v, 0);
  for (const [kind, v] of w) { k -= v; if (k < 0) return kind; }
  return 'skeleton';
}
function populate(players) {
  const many = setup.count >= tune.extra_enemies_from;
  for (let r = 0; r < RW * RW; r++) {
    if (players.includes(r)) continue;
    const R = state.rooms[r];
    if (r === BOSS_ROOM) {
      const bx = R.rc * ROOM + 6, by = R.rr * ROOM + 6;
      addEnemy('boss', bx, by, bx, by);
      const escorts = tune.boss_escorts + (many ? 1 : 0);
      for (let k = 0; k < escorts; k++) { const c = freeCell(r); if (c) addEnemy(k % 2 ? 'goblin' : 'skeleton', c[0], c[1], c[0], c[1]); }
      continue;
    }
    const lo = Math.min(tune.room_enemies_min, tune.room_enemies_max), hi = Math.max(tune.room_enemies_min, tune.room_enemies_max);
    let count = lo + Math.floor(rng() * (hi - lo + 1));
    if (many && rng() * 100 < tune.extra_enemy_chance) count++;
    for (let k = 0; k < count; k++) {
      const c = freeCell(r); if (!c) break;
      addEnemy(pickKind(), c[0], c[1], c[0], c[1]);
      const w = freeCell(r); if (w) state.enemies[state.enemies.length - 1].wp[1] = w;
    }
    if (rng() * 100 < tune.chest_chance) { const c = freeCell(r); if (c) state.objs[idx(c[0], c[1])] = 'chest'; }
  }
}
function addEnemy(kind, x, y, wx, wy) {
  const hp = kind === 'boss' ? tune.boss_hp + tune.boss_hp_per_hero * setup.count : tune[kind + '_hp'];
  state.enemies.push({ id: 'e' + state.enemies.length, hero: false, kind, x, y, hp, maxHp: hp, alive: true,
    state: 'dormant', wp: [[x, y], [wx, wy]], wpi: 1, last: null, room: roomOf(x, y), flash: 0, anim: null,
    face: -1, hurtBy: {} });
}
const activeHero = () => state.heroes[state.active];
const boss = () => state.enemies.find(e => e.kind === 'boss');
const awake = e => e.alive && e.state !== 'dormant';
function log(s) { state.log.push(s); if (state.log.length > 6) state.log.shift(); events.push({ type: 'log', text: s }); }
function pop(x, y, txt, color, delay = 0) { state.pops.push({ x, y, txt, color, t: -delay, life: 1.2 }); }
function unitAt(x, y) {
  for (const h of state.heroes) if (h.x === x && h.y === y) return h;
  for (const e of state.enemies) if (e.alive && e.x === x && e.y === y) return e;
  return null;
}
function passable(x, y) {
  if (!inb(x, y)) return false;
  const t = state.tiles[idx(x, y)];

  if (state.phase !== 'hero' || busy() || mouse.x < 0 || uiHit(mouse.x, mouse.y)) return;
  const h = activeHero(), lines = [];
  const u = hoverUnit, t = hoverTile;
  if (u && !u.hero) {
    lines.push([`${ENEMY_NAMES[u.kind]} · vida ${u.hp}/${u.maxHp}`, '#f4e6c4']);
    const aimed = state.mode && state.mode.card !== undefined && cardsOf(h)[state.mode.card] === 'aimed';
    if (state.mode && !aimed) { /* card targeting: the gold tiles say it */ }
    else if (canAttack(h, u)) {
      const o = aimed ? { ignoreCover: true, bonus: tune.aimed_bonus_hit } : {};
      const c = hitChance(h, u, o), dmg = hstat(h, 'dmg') + (aimed ? tune.aimed_bonus_dmg : 0);
      lines.push([`Ataque: ${c.ch}% (${c.need}+ en d20) · ${dmg} daño`, '#ffd56a']);
      if (c.parts.length) lines.push([c.parts.join(' · '), '#d6ccbc']);
    } else lines.push([los(h, u) ? 'Fuera de alcance' : 'Sin línea de visión', '#b8ae9c']);
    if (u.kind === 'boss') lines.push(['Marca un área 3x3 que golpea el turno enemigo siguiente', '#ff9a8a']);
    else {
      const tg = chooseTarget(u);
      lines.push([u.state === 'patrol' ? (tg ? `Patrulla, pero te verá: irá a por J${tg.player + 1}` : 'Patrulla: aún no os ha visto') : (tg ? `Persigue a J${tg.player + 1}` : 'Os busca donde os vio por última vez'), '#d6ccbc']);
    }
  } else if (u && u.hero) {
    lines.push([`J${u.player + 1} ${CLASS_INFO[u.cls].name} · vida ${u.hp}/${u.maxHp}`, '#f4e6c4']);
  } else if (t && inb(t.x, t.y) && tileSeen(t.x, t.y)) {
    const i = idx(t.x, t.y);
    if (state.slam.some(s => cheb(s, t) <= 1)) lines.push([`El Carcelero golpeará aquí: ${tune.boss_slam_dmg} daño`, '#ff9a8a']);
    if (state.tiles[i] === T_DOOR) lines.push([doorNear(h, state.doors[state.doorAt[i]]) ? 'Abrir puerta (1 PA)' : 'Puerta: ponte al lado para abrirla', '#f4e6c4']);
    else if (state.objs[i] === 'chest') lines.push([cheb(h, t) === 1 ? 'Abrir cofre (1 PA): un Tónico' : 'Cofre: ponte al lado', '#f4e6c4']);
    else if (state.objs[i] === 'pillar') lines.push(['Obstáculo: cobertura (los disparos a través fallan más)', '#d6ccbc']);
  }
  if (!lines.length) return;
  ctx.font = `15px ${FONT}`;
  const w = Math.max(...lines.map(l => ctx.measureText(l[0]).width)) + 20, hh = lines.length * 20 + 12;
  const x = clamp(mouse.x + 18, 8, W - w - 8), y = clamp(mouse.y + 18, 8, H - hh - 8);
  panel(x, y, w, hh, '#6a5a3a', 'rgba(10,8,14,0.92)');
  lines.forEach((l, k) => text(l[0], x + 10, y + 16 + k * 20, 15, l[1], 'left'));
}

// ---- Scenes -----------------------------------------------------------------------------
let hoverTile = null;
function backdrop() {
  clear('#07060b');
  const g = ctx.createRadialGradient(W / 2, H * 0.55, 40, W / 2, H * 0.55, 620);
  g.addColorStop(0, 'rgba(120,70,30,0.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  const room = artImage('rooms', 'pilares') || paintedRoom(TEMPLATES.pilares ? 'pilares' : TEMPLATE_IDS[0]), s = 860;
  ctx.globalAlpha = 0.5; ctx.drawImage(room, W / 2 - s / 2, H / 2 - s / 2 + 30, s, s); ctx.globalAlpha = 1;
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const v = ctx.createRadialGradient(W / 2, H / 2, 160, W / 2, H / 2, 700);
  v.addColorStop(0, 'rgba(5,4,8,0)'); v.addColorStop(1, 'rgba(5,4,8,0.95)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
function arrowBtn(x, y, dir, act) {
  P([x - 9 * dir, y - 11, x + 9 * dir, y, x - 9 * dir, y + 11], '#c9a24a', 2);
  ui.push({ x: x - 16, y: y - 16, w: 32, h: 32, act });
}
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      backdrop();
      const kinds = ['warrior', 'mage', 'healer', 'archer', 'skeleton', 'goblin', 'rat', 'boss'];
      const names = ['Guerrero', 'Mago', 'Curandero', 'Arquero', 'Esqueleto', 'Arquero goblin', 'Rata de cripta', 'El Carcelero'];
      kinds.forEach((k, i) => {
        const x = 90 + i * 157, y = 420;
        El(x, y, k === 'boss' ? 40 : 26, k === 'boss' ? 14 : 10, 'rgba(0,0,0,0.5)', 0);
        drawFigure(k, x, y, 2, i < 4 ? 1 : -1);
        textO(names[i], x, y + 50, 18, '#f4e6c4');
      });
      textO('Antorchas y Dados · figuras', W / 2, 60, 30, '#f2c46a');
    },
  },
  title: {
    update() {
      if (pressed('Enter') || pressed('Space') || clicks.length) { scene = 'setup'; setup.row = 0; }
    },
    draw() {
      backdrop();
      textO(TITLE, W / 2, 92, 66, '#f2c46a');
      text('Una mazmorra a oscuras, de 1 a 4 héroes en la misma pantalla', W / 2, 146, 20, '#d6ccbc');
      ['warrior', 'mage', 'healer', 'archer'].forEach((k, i) => drawFigure(k, W / 2 - 240 + i * 160, 330, 2.2, i < 2 ? 1 : -1));
      panel(W / 2 - 440, 392, 880, 226, '#6a5a3a', 'rgba(10,8,14,0.82)');
      CONTROLS.forEach((c, i) => text(c, W / 2, 420 + i * 34, 17, '#e0d6c4'));
      textO('Enter o clic para empezar', W / 2, H - 56, 26, '#ffffff');
    },
  },
  setup: {
    update() {
      for (const c of clicks) { const u = uiHit(c.x, c.y); if (u) u.act(); }
      const rows = setup.count + 1;
      if (pressed('ArrowUp') || pressed('KeyW')) setup.row = (setup.row + rows - 1) % rows;
      if (pressed('ArrowDown') || pressed('KeyS')) setup.row = (setup.row + 1) % rows;
      const dir = (pressed('ArrowRight') || pressed('KeyD')) ? 1 : (pressed('ArrowLeft') || pressed('KeyA')) ? -1 : 0;
      if (dir) changeSetup(setup.row, dir);
      for (let k = 1; k <= 4; k++) if (pressed('Digit' + k)) { setup.count = k; setup.row = Math.min(setup.row, k); }
      if (pressed('Escape')) scene = 'title';
      if (pressed('Enter') || pressed('Space')) startGame();
    },
    draw() {
      backdrop();
      textO('Prepara la partida', W / 2, 70, 44, '#f2c46a');
      panel(W / 2 - 360, 112, 720, 120 + setup.count * 76, '#8a6a3a', 'rgba(10,8,14,0.86)');
      const rowY = r => 160 + (r === 0 ? 0 : 40 + (r - 1) * 76);
      if (setup.row === 0) { rrect(W / 2 - 340, rowY(0) - 26, 680, 52, 8); ctx.fillStyle = 'rgba(255,215,110,0.12)'; ctx.fill(); }
      text('Jugadores', W / 2 - 300, rowY(0), 24, '#f4e6c4', 'left', true);
      arrowBtn(W / 2 + 100, rowY(0), -1, () => changeSetup(0, -1));
      text(`${setup.count}`, W / 2 + 160, rowY(0), 30, '#ffffff', 'center', true);
      arrowBtn(W / 2 + 220, rowY(0), 1, () => changeSetup(0, 1));
      for (let i = 0; i < setup.count; i++) {
        const y = rowY(i + 1);
        if (setup.row === i + 1) { rrect(W / 2 - 340, y - 36, 680, 72, 8); ctx.fillStyle = 'rgba(255,215,110,0.12)'; ctx.fill(); }
        C(W / 2 - 300, y, 10, PLAYER_COLORS[i], 2);
        text(`Jugador ${i + 1}`, W / 2 - 280, y, 22, '#f4e6c4', 'left', true);
        text(['esquina noroeste', 'esquina sureste', 'esquina noreste', 'esquina suroeste'][i], W / 2 - 280, y + 24, 14, '#a89e8c', 'left');
        arrowBtn(W / 2 + 40, y, -1, () => changeSetup(i + 1, -1));
        drawFigure(setup.classes[i], W / 2 + 100, y + 28, 0.95);
        text(CLASS_INFO[setup.classes[i]].name, W / 2 + 186, y, 22, '#ffffff', 'center', true);
        arrowBtn(W / 2 + 270, y, 1, () => changeSetup(i + 1, 1));
      }
      const by = 112 + 120 + setup.count * 76 + 20;
      button(W / 2 - 130, by, 260, 48, 'Entrar en la mazmorra (Enter)', true, startGame);
      text('Flechas: elegir y cambiar · 1-4: número de jugadores · Esc: volver', W / 2, by + 74, 16, '#b8ae9c');
    },
  },
  play: {
    update(dt) {
      state.t += dt;
      hoverUnit = unitAtScreen(mouse.x, mouse.y);
      hoverTile = hoverUnit ? { x: hoverUnit.x, y: hoverUnit.y } : screenToTile(mouse.x, mouse.y);
      updateCamera(dt);
      updateAnims(dt);
      if (state.endTimer > 0) {
        state.endTimer -= dt;
        if (state.endTimer <= 0) scene = state.won ? 'results' : 'over';
        return;
      }
      if (state.phase === 'hero') heroPhase(); else enemyPhase(dt);
    },
    draw() {
      clear('#05050a');
      drawBoard();
      drawHUD();
    },
  },
  over: {
    update(dt) {
      state.t += dt;
      if (pressed('KeyR') || pressed('Enter') || clicks.length) startGame();
      if (pressed('Escape')) scene = 'title';
    },
    draw() {
      clear('#05050a'); drawBoard();
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
      textO(state.gained || 'Todos los héroes han caído', W / 2, H / 2 - 40, 46, '#ff8a7a');
      text(`Ronda ${state.round} · enemigos derrotados: ${state.score}`, W / 2, H / 2 + 14, 20, '#e0d6c4');
      textO('R, Enter o clic: reintentar el nivel · Esc: menú', W / 2, H / 2 + 64, 22, '#ffffff', 'center', false);
    },
  },
  results: {
    update(dt) {
      state.t += dt;
      if (pressed('Enter') || clicks.length) { scene = 'title'; reset(); }
      if (pressed('KeyR')) startGame();
    },
    draw() {
      clear('#05050a'); drawBoard();
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
      textO('¡Victoria!', W / 2, 120, 58, '#f2c46a');
      text(state.gained, W / 2, 176, 22, '#f0e6d0');
      panel(W / 2 - 340, 210, 680, 40 + state.heroes.length * 64, '#8a6a3a', 'rgba(10,8,14,0.88)');
      state.heroes.forEach((o, k) => {
        const y = 250 + k * 64;
        drawFigure(o.cls, W / 2 - 290, y + 24, 0.8);
        C(W / 2 - 250, y - 6, 6, PLAYER_COLORS[o.player], 1.5);
        text(`Jugador ${o.player + 1} · ${CLASS_INFO[o.cls].name}`, W / 2 - 236, y - 6, 20, '#f4e6c4', 'left', true);
        text(`Daño ${o.stats.dmg} · Enemigos en los que participó ${o.stats.kills} · Ayudas ${o.stats.help}`, W / 2 - 250, y + 20, 16, '#d6ccbc', 'left');
      });
      textO('Enter o clic: volver al menú · R: jugar otra vez', W / 2, H - 50, 22, '#ffffff', 'center', false);
    },
  },
};
function changeSetup(row, dir) {
  if (row === 0) { setup.count = clamp(setup.count + dir, 1, 4); setup.row = Math.min(setup.row, setup.count); }
  else { const i = row - 1, k = CLASSES.indexOf(setup.classes[i]); setup.classes[i] = CLASSES[(k + dir + 4) % 4]; }
}
function startGame() { reset(); scene = 'play'; events.push({ type: 'start', players: setup.count, classes: setup.classes.slice(0, setup.count) }); }

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); clicks.length = 0;
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  ui = [];
  ctx.setTransform(baseTransform);
  scenes[scene].draw();
  if (muted && scene !== 'figures') textO('Silencio (M)', W - 14, H - 16, 14, '#a89e8c', 'right', false);
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

loadArt();
reset();
scene = params.get('scene') || 'title';
if (scene === 'play') startGame();
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
