<script>
'use strict';
// Dungeon Random: a co-op tactics board for 1-4 heroes on one screen (hot seat).
// Kept from the one-shot starter: the fixed step, the clock hook, window.game, and the
// play and figures scenes the checks read.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size
const PIXEL = false;
const FONT = 'Georgia, "Palatino Linotype", "Book Antiqua", serif';
const TITLE = 'Dungeon Random';
const CONTROLS = [
  'Clic en una casilla azul: mover (1 PA)',
  'Clic en un enemigo: atacar (1 PA) · en una puerta o cofre al lado: abrir (1 PA)',
  'Clic en tu habilidad o tecla 1: usarla · clic derecho o Esc: cancelar',
  'Espacio: fin de turno · Z: deshacer movimiento · T: tónico',
  'Flechas / WASD o arrastrar con clic derecho: cámara · rueda: zoom · C: centrar · minimapa: ir a una sala',
  'M: silencio',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
// The hero deck has a seed of its own, so the dungeon (seed) stays the same while the heroes
// change: it starts from the clock, moves on at every new draw, and is kept on a retry.
// ?heroseed=N fixes it, and ?seed=N alone fixes it too, so a check plays the same every run.
let heroSeed = Number(params.get('heroseed')) || (params.get('seed') ? Number(params.get('seed')) ^ 0x5eed : (Date.now() % 2147483647) | 0);
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let baseTransform;
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
  baseTransform = ctx.getTransform();
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', bold = false) {
  ctx.fillStyle = c; ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function textO(s, x, y, size, c, align = 'center', bold = true) { // outlined text over the board
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = 'rgba(8,6,12,0.95)';
  ctx.strokeText(s, x, y); ctx.fillStyle = c; ctx.fillText(s, x, y);
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow') || e.code === 'Tab') e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());

// Pointer: clicks are queued and handled on the step; the camera drag is view only.
const mouse = { x: -1, y: -1 };
const clicks = [];
let drag = null, wheel = 0;
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
canvas.addEventListener('pointerdown', e => {
  startAudio();
  const p = toLogical(e); mouse.x = p.x; mouse.y = p.y;
  if (e.button === 1 || e.button === 2) drag = { x: p.x, y: p.y, moved: 0, button: e.button };
  else clicks.push({ x: p.x, y: p.y, button: 0 });
});
addEventListener('pointermove', e => {
  const p = toLogical(e);
  if (drag) {
    const dx = p.x - mouse.x, dy = p.y - mouse.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    cam.x -= dx / cam.zoom; cam.y -= dy / cam.zoom; cam.follow = false;
  }
  mouse.x = p.x; mouse.y = p.y;
});
addEventListener('pointerup', () => {
  if (drag && drag.moved < 6 && drag.button === 2) clicks.push({ x: drag.x, y: drag.y, button: 2 });
  drag = null;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); wheel += Math.sign(e.deltaY); }, { passive: false });

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }

function tone(freq, dur, type = 'square', vol = 0.3, delay = 0, slideTo = 0) {

}
function sfx(name) {
  switch (name) {
    case 'step': tone(180, 0.06, 'triangle', 0.12); break;
    case 'door': tone(110, 0.4, 'sawtooth', 0.12, 0, 60); tone(70, 0.3, 'square', 0.08, 0.1); break;
    case 'chest': tone(520, 0.1, 'triangle', 0.18); tone(780, 0.18, 'triangle', 0.16, 0.08); break;
    case 'dice': for (let i = 0; i < 4; i++) tone(700 + i * 90, 0.03, 'square', 0.06, i * 0.06); break;
    case 'hit': tone(150, 0.14, 'square', 0.22, 0.25, 70); break;
    case 'crit': tone(150, 0.2, 'sawtooth', 0.25, 0.25, 50); tone(900, 0.15, 'triangle', 0.15, 0.25); break;
    case 'miss': tone(520, 0.1, 'sine', 0.14, 0.25, 300); break;
    case 'heal': tone(660, 0.2, 'sine', 0.16); tone(880, 0.25, 'sine', 0.14, 0.1); break;
    case 'fire': tone(90, 0.45, 'sawtooth', 0.22, 0, 40); break;
    case 'slam': tone(55, 0.6, 'sawtooth', 0.3, 0, 30); break;
    case 'alert': tone(440, 0.08, 'square', 0.12); tone(330, 0.1, 'square', 0.12, 0.08); break;
    case 'down': tone(330, 0.25, 'triangle', 0.2); tone(220, 0.35, 'triangle', 0.2, 0.2); break;
    case 'card': tone(400, 0.08, 'triangle', 0.14); tone(600, 0.1, 'triangle', 0.12, 0.06); break;
    case 'flip': tone(900, 0.05, 'sine', 0.08, 0.05, 500); tone(240, 0.12, 'triangle', 0.14, 0.18); break;
    case 'win': [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'triangle', 0.18, i * 0.14)); break;
    case 'lose': [330, 262, 196].forEach((f, i) => tone(f, 0.4, 'triangle', 0.18, i * 0.2)); break;
  }
}

// ---- The game: the dungeon ---------------------------------------------------------------
// A table of 5x5 room cards, each a room of 12x12 cells seen from above, with a gap of table
// between cards. rooms.js holds the cards and art.js the painted images. The seed shuffles the
// main deck (24 cards around the centre) and the boss deck (the centre card), picks which
// neighbouring exits get a door, and what is inside. Cards lie face down until a door opens onto
// them; the heroes' chosen corners start face up.
// The rules work on one 60x60 grid of cells; the gap exists only where cells are drawn
// (cellX/cellY, wpos), so a door's two halves are neighbouring cells across the gap.
const ROOM = 12, RW = 5, N = ROOM * RW, TS = 64; // TS: world px per cell
const T_WALL = 0, T_FLOOR = 1, T_DOOR = 2, T_OPEN = 3;
const DIR4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const BOSS_ROOM = 12; // the centre card
// The corner cards, in the order the setup offers them: opposite corners first.
const CORNER_ROOMS = [0, 24, 4, 20];
const CORNER_NAMES = { 0: 'noroeste', 4: 'noreste', 20: 'suroeste', 24: 'sureste' };
const DOORWAY = [5, 6]; // the cells of each side that are the card's exit
const SIDES = { n: [0, -1], s: [0, 1], w: [-1, 0], e: [1, 0] };
const TEMPLATES = window.ROOMS || {};
const ARTS = window.ART || {};
const TEMPLATE_IDS = Object.keys(TEMPLATES);

function checkTemplates() { // the rules rooms.js states; a broken card is named in the console
  for (const id of TEMPLATE_IDS) {
    const m = TEMPLATES[id].map, bad = [];
    if (!Array.isArray(m) || m.length !== ROOM || m.some(r => r.length !== ROOM)) bad.push('no es de 12x12');
    else {
      for (let i = 0; i < ROOM; i++) for (const [x, y] of [[i, 0], [i, ROOM - 1], [0, i], [ROOM - 1, i]]) {
        if (exitCell(x, y)) { if (m[y][x] !== '.') bad.push(`salida tapada en ${x},${y}`); }
        else if (!'#t'.includes(m[y][x])) bad.push(`anillo abierto en ${x},${y}`);
      }
      for (const d of DOORWAY) for (const [x, y] of [[d, 1], [d, ROOM - 2], [1, d], [ROOM - 2, d]]) if (m[y][x] !== '.') bad.push(`entrada tapada en ${x},${y}`);
      if (TEMPLATES[id].use === 'boss' && m[6][6] !== '.') bad.push('el centro (6,6) no es suelo');
      const open = (x, y) => m[y] && (m[y][x] === '.');
      let floor = 0; for (const r of m) for (const ch of r) if (ch === '.') floor++;
      const seen = new Set([`${DOORWAY[0]},0`]), q = [[DOORWAY[0], 0]];
      while (q.length) {
        const [x, y] = q.pop();
        for (const [dx, dy] of DIR4) { const k = `${x + dx},${y + dy}`; if (!seen.has(k) && open(x + dx, y + dy)) { seen.add(k); q.push([x + dx, y + dy]); } }
      }
      if (seen.size < floor) bad.push(`${floor - seen.size} casillas de suelo sin camino`);
    }
    if (bad.length) console.warn(`rooms.js: ${id}: ${bad.slice(0, 3).join(', ')}`);
  }
  if (tplOf('room').length < RW * RW - 1) console.warn(`rooms.js: el mazo de salas tiene ${tplOf('room').length} cartas; hacen falta ${RW * RW - 1}`);
  if (!tplOf('boss').length) console.warn('rooms.js: el mazo del jefe está vacío');
}
checkTemplates();

// The hero deck (design/heroes.md): each player draws one. Stats live in config.js as <id>_<stat>;
// color is the hero's reserved colour (art bible §4); no is the equipment line, not used yet.
const HEROES = {
  flink: { name: 'Flink el herrero', short: 'Flink', role: 'Apoyo resistente', color: '#ff7a1f', ability: 'forge',
    // The card's text is the designer's; the game plays the d20 + shield Forja until equipment exists.
    desc: 'Lanza un dado en cada turno. Si sale 5 ó 6 reparas una pieza de equipo a ti o a otro héroe.' },
  natwure: { name: 'Natwure', short: 'Natwure', role: 'Invocador', color: '#5fd13a', ability: 'tree', no: 'No puede usar Espadas' },
  sombra: { name: 'Sombra', short: 'Sombra', role: 'Exploradora', color: '#7fd4ff', ability: 'ghost' },
  gorm: { name: 'Gorm el muro', short: 'Gorm', role: 'Tanque', color: '#c8763a', ability: 'guard', no: 'No puede usar Arcos' },
  orla: { name: 'Hermana Orla', short: 'Orla', role: 'Curandera', color: '#c9d1dc', ability: 'hands' },
  kesh: { name: 'Kesh la cazadora', short: 'Kesh', role: 'Tiradora', color: '#2ec4b6', ability: 'aimed', no: 'No puede usar Armaduras pesadas' },
  morwen: { name: 'Morwen la hechicera', short: 'Morwen', role: 'Control en área', color: '#b38be8', ability: 'chains' },
  mirko: { name: 'Mirko el tahúr', short: 'Mirko', role: 'Manipula dados', color: '#e04ca0', ability: 'reroll' },
  velia: { name: 'Velia la farolera', short: 'Velia', role: 'Luz y cobertura', color: '#f2e14a', ability: 'lantern' },
  pip: { name: 'Pip la ganzúa', short: 'Pip', role: 'Puertas y cofres', color: '#ece3cc', ability: 'lockpick' },
};
const HERO_IDS = Object.keys(HEROES);
const ENEMY_NAMES = { skeleton: 'Esqueleto', goblin: 'Arquero goblin', rat: 'Rata de cripta', boss: 'El Carcelero', tree: 'Árbol guardián' };
const PLAYER_COLORS = ['#e8573f', '#3f8fe8', '#e8c43f', '#4fc46a'];
// One ability per hero. Passive ones have no target and are never picked; active ones cost
// <id>_cost AP and cool down <id>_cd of the hero's own turns.
const ABILITIES = {
  forge: { name: 'Forja', passive: true, text: () => ['Al empezar tu turno tiras el d20:', `con ${tune.forge_on}+ das escudo ${tune.forge_shield} al`, `más herido a ${tune.forge_range} o menos (o a ti).`] },
  tree: { name: 'Árbol guardián', target: 'adj', text: () => ['Un árbol en una casilla a tu lado:', `ataque ${tune.tree_atk}, defensa ${tune.tree_def}, vida ${tune.tree_hp}.`, 'Atrae a los enemigos que lo ven.'] },
  ghost: { name: 'Incorpórea', passive: true, text: () => ['Al moverte atraviesas muros,', 'pero no acabas dentro de uno.', 'Cruzar a una carta la gira.'] },
  guard: { name: 'Escudo humano', passive: true, text: () => ['Una vez por turno enemigo recibes', 'el daño de un aliado a tu lado,', 'y cuenta tu defensa.'] },
  hands: { name: 'Imposición de manos', target: 'allyAny', range: 'hands_range', text: () => [`Cura ${tune.hands_heal} a un aliado a ${tune.hands_range} o menos`, '(o a ti). Levanta a un derribado', `sin Tónico, con ${tune.hands_revive_hp} de vida.`] },
  aimed: { name: 'Tiro certero', target: 'enemy', text: () => ['Un ataque que ignora la', `cobertura y hace +${tune.aimed_bonus_dmg} de daño.`] },
  chains: { name: 'Cadenas arcanas', target: 'area', range: 'chains_range', text: () => [`Área 3x3 a la vista, a ${tune.chains_range} o menos:`, `${tune.chains_dmg} de daño, siempre acierta.`, 'No se mueven en su próximo turno.'] },
  reroll: { name: 'Dedos ligeros', passive: true, text: () => ['Una vez por ronda se repite el', 'primer d20 fallado, tuyo o de un', `aliado a ${tune.reroll_range} o menos.`] },
  lantern: { name: 'Farol', passive: true, text: () => [`Tu luz llega ${tune.lantern_bonus} casillas más lejos.`, 'Los enemigos dentro de tu luz', 'no reciben cobertura.'] },
  lockpick: { name: 'Ganzúa', passive: true, text: () => ['Abrir puertas y cofres no te', `cuesta PA, y tus cofres dan`, `${tune.pip_tonics} Tónicos en vez de 1.`] },
};
/** A copy of list shuffled by its own seeded generator, so the dungeon's dice are untouched. */
function seededShuffle(list, s) {
  const r = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const a = list.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}

const idx = (x, y) => y * N + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const cheb = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
const manh = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function roomOf(x, y) { return inb(x, y) ? ((x / ROOM) | 0) + ((y / ROOM) | 0) * RW : -1; }
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

function estat(e, s) { return tune[`${e.kind}_${s}`]; }

// ---- State ------------------------------------------------------------------------------
const setup = { count: 2, corners: CORNER_ROOMS.slice(), row: 0 };
const cam = { x: 0, y: 0, zoom: 0.8, tx: 0, ty: 0, follow: true };
let scene, state, ui = [];

function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  const n = setup.count, players = setup.corners.slice(0, n), rooms = RW * RW;
  state = {
    t: 0, score: 0, gained: '', round: 1, phase: 'hero', active: 0, mode: null,
    tiles: new Array(N * N).fill(T_WALL), objs: new Array(N * N).fill(null), doorAt: new Int16Array(N * N).fill(-1),
    rooms: [], doors: [], torches: [],
    revealed: new Array(rooms).fill(false), revealT: new Array(rooms).fill(-99), revealFrom: new Array(rooms).fill(null),
    heroes: [], enemies: [], summons: [], log: [], pops: [], fx: [], dice: null, slam: [], undo: null,
    enemyQueue: [], enemyTimer: 0, autoEnd: 0, lock: 0, endTimer: 0, won: false, lost: false,
    banner: null, shake: 0, acting: null, players: n, rerolled: false,
  };
  buildDungeon(players);
  // The hero deck, shuffled from the seed: player i plays the i-th card drawn
  const drawn = seededShuffle(HERO_IDS, heroSeed);
  for (let i = 0; i < n; i++) { // each hero on the free floor nearest the table's corner, in their card
    const r = players[i], cls = drawn[i], hp = tune[cls + '_hp'];
    const [x, y] = cornerCell(r);
    state.heroes.push({ id: 'h' + i, hero: true, player: i, cls, kind: cls, x, y, hp, maxHp: hp,
      ap: 0, cds: [0], shield: 0, downed: false, tonics: 0, miss: 0, flash: 0, anim: null, face: 1,
      guarded: false, stats: { dmg: 0, kills: 0, help: 0 } });

  for (const e of state.enemies) if (state.revealed[e.room]) e.state = 'patrol';

function shuffled(list) { const a = list.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildDungeon(players) {
  // Deal the table: the boss deck's top card in the centre, the main deck's in the other 24 spots.
  const deck = shuffled(tplOf('room')), bossDeck = shuffled(tplOf('boss'));
  state.deck = { rooms: deck.length, bosses: bossDeck.length };
  for (let r = 0; r < RW * RW; r++) {
    const tpl = r === BOSS_ROOM ? (bossDeck[0] || deck[0]) : (deck.shift() || TEMPLATE_IDS[r % TEMPLATE_IDS.length]);
    const R = { tpl, rc: r % RW, rr: (r / RW) | 0, variant: Math.floor(rng() * 997), exits: { n: -1, s: -1, w: -1, e: -1 } };
    state.rooms.push(R);
    const m = TEMPLATES[tpl].map;
    for (let ly = 0; ly < ROOM; ly++) for (let lx = 0; lx < ROOM; lx++) {
      const x = R.rc * ROOM + lx, y = R.rr * ROOM + ly, ch = m[ly][lx], i = idx(x, y);
      // an exit is wall (covered by rubble) until a door is put in it
      state.tiles[i] = (ch === '.' || ch === 'o') && !exitCell(lx, ly) ? T_FLOOR : T_WALL;
      if (ch === 'o') state.objs[i] = 'pillar';
      if (ch === 't') { // its light comes from the side that faces the floor
        const [dx, dy] = torchFacing(m, lx, ly);
        state.torches.push({ x, y, room: r, dx, dy, lx: x + dx * 0.6, ly: y + dy * 0.6 });
      }
    }
  }
  // Which neighbours connect: a random maze that joins every room, then a few extra doors.
  const edges = [];
  for (let r = 0; r < RW * RW; r++) {
    if (r % RW < RW - 1) edges.push([r, r + 1]);
    if (((r / RW) | 0) < RW - 1) edges.push([r, r + RW]);
  }
  for (let i = edges.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [edges[i], edges[j]] = [edges[j], edges[i]]; }
  const parent = [...Array(RW * RW).keys()];
  const find = a => parent[a] === a ? a : (parent[a] = find(parent[a]));
  for (const [a, b] of edges) {
    const joins = find(a) !== find(b);

      const by = 112 + 120 + setup.count * 76 + 20;
      button(W / 2 - 130, by, 260, 48, 'Robar héroes (Enter)', true, () => startGame(true));
      text('Flechas: elegir fila y cambiar · Q / E: esquina · 1-4: jugadores · Esc: volver · el héroe se roba al entrar', W / 2, by + 74, 16, '#b8ae9c');
    },
  },
  draw: {
    update(dt) {
      state.t += dt; drawing.t += dt;
      for (const c of clicks) { const u = uiHit(c.x, c.y); if (u) u.act(); }
      if (pressed('Enter') || pressed('Space')) drawNext();
      if (pressed('Escape')) scene = 'setup';
    },
    draw() {
      backdrop();
      const n = state.heroes.length, k = drawing.n, done = k >= n;
      textO(done ? 'Vuestros héroes' : `Jugador ${k + 1}: roba tu héroe`, W / 2, 56, 40, '#f2c46a');
      // the deck: what is left of the 10, face down
      const dx = 70, dy = 150, dw = 220, dh = dw * HCH / HCW, left = HERO_IDS.length - k;
      for (let i = Math.min(left, 6) - 1; i >= 0; i--) ctx.drawImage(heroBack(), dx + i * 3, dy - i * 3, dw, dh);
      text(`Mazo de héroes · quedan ${left}`, dx + dw / 2, dy + dh + 26, 16, '#d6ccbc');
      if (!done) {
        ui.push({ x: dx, y: dy - 18, w: dw + 18, h: dh + 18, act: drawNext });
        if (Math.sin(state.t * 4) > 0) { rrect(dx - 6, dy - 24, dw + 30, dh + 30, 14); ctx.strokeStyle = 'rgba(255,215,110,0.8)'; ctx.lineWidth = 3; ctx.stroke(); }
      }
      // the card just drawn, turning over in the middle
      if (k > 0) {
        const h = state.heroes[k - 1], f = clamp(drawing.t / Math.max(0.01, tune.flip_time), 0, 1);
        const s = 0.98, cw = HCW * s, chh = HCH * s, cx = 360, cy = 104;
        ctx.save(); ctx.translate(cx + cw / 2, cy); ctx.scale(Math.max(0.02, Math.abs(Math.cos(f * Math.PI))), 1); ctx.translate(-cw / 2, 0);
        if (f < 0.5) ctx.drawImage(heroBack(), 0, 0, cw, chh); else drawHeroCard(h.cls, 0, 0, s);
        ctx.restore();
        if (f >= 1) { C(cx + 10, cy + chh + 22, 8, PLAYER_COLORS[h.player], 2); text(`Jugador ${h.player + 1}`, cx + 26, cy + chh + 22, 18, '#f4e6c4', 'left', true); }
      }
      // who has drawn what
      panel(W - 400, 104, 380, 34 + n * 64, '#8a6a3a', 'rgba(10,8,14,0.86)');
      state.heroes.forEach((o, i) => {
        const y = 140 + i * 64;
        C(W - 376, y, 9, PLAYER_COLORS[o.player], 2);
        text(`Jugador ${o.player + 1}`, W - 358, y - 12, 18, '#f4e6c4', 'left', true);
        if (i < k && (i < k - 1 || drawing.t >= tune.flip_time * 0.5)) {
          drawFigure(o.cls, W - 60, y + 22, 0.7);
          text(HEROES[o.cls].name, W - 358, y + 14, 17, HEROES[o.cls].color, 'left', true);
        } else text(i === k ? 'roba ahora' : 'espera su turno', W - 358, y + 14, 16, '#a89e8c', 'left');
      });
      const label = done ? 'Entrar en la mazmorra (Enter)' : 'Robar (Enter o clic en el mazo)';
      button(W - 360, 104 + 34 + n * 64 + 20, 300, 46, label, drawing.t >= tune.flip_time, drawNext);
      text('El héroe que sale es el que juegas · Esc: volver', W - 210, 104 + 34 + n * 64 + 92, 15, '#b8ae9c');
    },
  },
  play: {
    update(dt) {
      state.t += dt;
      hoverUnit = unitAtScreen(mouse.x, mouse.y);
      hoverTile = hoverUnit ? { x: hoverUnit.x, y: hoverUnit.y } : screenToTile(mouse.x, mouse.y);
      updateCamera(dt);
      updateAnims(dt);
      if (state.endTimer > 0) {
        state.endTimer -= dt;
        if (state.endTimer <= 0) scene = state.won ? 'results' : 'over';
        return;
      }
      if (state.phase === 'hero') heroPhase(); else enemyPhase(dt);
    },
    draw() {
      clear('#05050a');
      drawBoard();
      drawHUD();
    },
  },
  over: {
    update(dt) {
      state.t += dt;
      if (pressed('KeyR') || pressed('Enter') || clicks.length) startGame(false);
      if (pressed('Escape')) scene = 'title';
    },
    draw() {
      clear('#05050a'); drawBoard();
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
      textO(state.gained || 'Todos los héroes han caído', W / 2, H / 2 - 40, 46, '#ff8a7a');
      text(`Ronda ${state.round} · enemigos derrotados: ${state.score}`, W / 2, H / 2 + 14, 20, '#e0d6c4');
      textO('R, Enter o clic: reintentar el nivel · Esc: menú', W / 2, H / 2 + 64, 22, '#ffffff', 'center', false);
    },
  },
  results: {
    update(dt) {
      state.t += dt;
      if (pressed('Enter') || clicks.length) { scene = 'title'; reset(); }
      if (pressed('KeyR')) startGame(false);
    },
    draw() {
      clear('#05050a'); drawBoard();
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
      textO('¡Victoria!', W / 2, 120, 58, '#f2c46a');
      text(state.gained, W / 2, 176, 22, '#f0e6d0');
      panel(W / 2 - 340, 210, 680, 40 + state.heroes.length * 64, '#8a6a3a', 'rgba(10,8,14,0.88)');
      state.heroes.forEach((o, k) => {
        const y = 250 + k * 64;
        drawFigure(o.cls, W / 2 - 290, y + 24, 0.8);
        C(W / 2 - 250, y - 6, 6, PLAYER_COLORS[o.player], 1.5);
        text(`Jugador ${o.player + 1} · ${HEROES[o.cls].name}`, W / 2 - 236, y - 6, 20, '#f4e6c4', 'left', true);
        text(`Daño ${o.stats.dmg} · Enemigos en los que participó ${o.stats.kills} · Ayudas ${o.stats.help}`, W / 2 - 250, y + 20, 16, '#d6ccbc', 'left');
      });
      textO('Enter o clic: volver al menú · R: jugar otra vez', W / 2, H - 50, 22, '#ffffff', 'center', false);
    },
  },
};
function changeSetup(row, dir) {
  if (row === 0) { setup.count = clamp(setup.count + dir, 1, 4); setup.row = Math.min(setup.row, setup.count); fixCorners(); }
  else changeCorner(row - 1, dir);
}
function fixCorners() { // two players never share a corner: a clash takes the first free one
  for (let i = 0; i < setup.count; i++) if (setup.corners.slice(0, i).includes(setup.corners[i]))
    setup.corners[i] = CORNER_ROOMS.find(c => !setup.corners.slice(0, i).includes(c));
}
function changeCorner(i, dir) { // the next corner round the table; a player already there swaps with this one
  const order = [0, 4, 24, 20], next = order[(order.indexOf(setup.corners[i]) + dir + 4) % 4];
  const other = setup.corners.slice(0, setup.count).indexOf(next);
  if (other >= 0) setup.corners[other] = setup.corners[i];
  setup.corners[i] = next;
}
function smallArrow(x, y, dir, act) {
  P([x - 6 * dir, y - 8, x + 6 * dir, y, x - 6 * dir, y + 8], '#c9a24a', 1.5);
  ui.push({ x: x - 14, y: y - 14, w: 28, h: 28, act });
}
function drawCornerPicker(x, y) { // the table from above: which corner each player starts in
  const s = 34, g = 5, S = RW * s + (RW - 1) * g;
  panel(x - 14, y, S + 28, S + 60, '#6a5a3a', 'rgba(10,8,14,0.86)');
  text('La mesa', x + S / 2, y + 22, 17, '#f4e6c4', 'center', true);
  for (let r = 0; r < RW * RW; r++) {
    const cx = x + (r % RW) * (s + g), cy = y + 40 + ((r / RW) | 0) * (s + g), p = setup.corners.slice(0, setup.count).indexOf(r);
    rrect(cx, cy, s, s, 4); ctx.fillStyle = p >= 0 ? '#6e6456' : r === BOSS_ROOM ? '#3a1a1c' : '#2a2632'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = r === BOSS_ROOM ? '#d0453a' : '#4a4038'; ctx.stroke();
    if (p >= 0) { C(cx + s / 2, cy + s / 2, 9, PLAYER_COLORS[p], 2); text(`${p + 1}`, cx + s / 2, cy + s / 2 + 1, 12, '#10080a', 'center', true); }
  }
}
/** Deal and go: through the hero draw from the setup screen, straight into play on a retry. */
function startGame(draw = false) {
  if (draw) heroSeed = (Math.imul(heroSeed ^ (heroSeed >>> 16), 0x45d9f3b) + 0x9E3779B9) | 0; // a new shuffle for a new draw
  reset(); scene = draw ? 'draw' : 'play'; drawing.n = 0; drawing.t = 9;
  events.push({ type: 'start', players: setup.count, heroes: state.heroes.map(h => h.cls), heroSeed, corners: setup.corners.slice(0, setup.count) });
}
// ---- The hero draw: each player in turn takes the top card of the deck and turns it over ----
const drawing = { n: 0, t: 9 }; // cards turned so far; seconds since the last one was drawn
function drawNext() {
  if (drawing.t < tune.flip_time) return; // let the card finish turning
  if (drawing.n < state.heroes.length) {
    drawing.n++; drawing.t = 0; sfx('flip');
    const h = state.heroes[drawing.n - 1];
    events.push({ type: 'draw', player: h.player, hero: h.cls });
  } else scene = 'play';
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); clicks.length = 0;
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  ui = [];
  ctx.setTransform(baseTransform);
  scenes[scene].draw();
  if (muted && scene !== 'figures') textO('Silencio (M)', W - 14, H - 16, 14, '#a89e8c', 'right', false);
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

loadArt();
reset();
scene = params.get('scene') || 'title';
if (scene === 'play' || scene === 'draw') startGame(scene === 'draw');
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
